name: reposter
"on":
schedule:
  - cron: '*/20 * * * *'
workflow_dispatch:
permissions:
contents: write
concurrency:
group: petribore-state
jobs:
run:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: python reposter.py
      env:
        BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
        BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
    - name: Commit state
      run: |
        git config user.name "petribore-bot"
        git config user.email "bot@users.noreply.github.com"
        git add state_reposter.json 2>/dev/null || true
        git diff --cached --quiet || (git commit -m "state" && git pull --rebase --autostash && git push)
